name: Release

# Builds the portable Windows package and publishes it as a GitHub release –
# only when the build succeeds. Linux and macOS packages are not built for now.
#
# Start it by pushing a version tag:
#
#     git tag v0.2.0
#     git push origin v0.2.0
#
# or from the Actions tab (Run workflow), naming the tag to create or use.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to release, e.g. v0.2.0 (created from the selected branch if it does not exist)"
        required: true
      prerelease:
        description: "Mark as a pre-release"
        type: boolean
        default: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ github.event.inputs.tag || github.ref_name }}
  # The Python bundled with the Windows package. Keep it the same as
  # PYTHON_VERSION in crates/magi-app/src/components.rs.
  PYTHON_VERSION: "3.13.14"
  TARGET: x86_64-pc-windows-msvc

jobs:
  build:
    name: Build (windows-x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # rust-toolchain.toml selects the compiler; add the target being built.
      - name: Set up Rust
        shell: bash
        run: |
          rustup show
          rustup target add "$TARGET"

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ env.TARGET }}

      - name: Build
        run: cargo build --release --locked -p magi-app --target ${{ env.TARGET }}

      # A package is the executable plus the documents a user should have, and
      # Python in a `python` folder, so the Python engine works without
      # installing anything; the app prefers it automatically. MacroMagi creates
      # its own `data` folder next to the executable on first run.
      - name: Package
        shell: bash
        run: |
          package="MacroMagi-${TAG}-windows-x64"
          mkdir -p "dist/$package"
          cp "target/$TARGET/release/macromagi.exe" README.md CHANGELOG.md EULA.md "dist/$package/"
          curl -fsSL -o python.zip "https://www.python.org/ftp/python/${PYTHON_VERSION}/python-${PYTHON_VERSION}-embed-amd64.zip"
          7z x python.zip -o"dist/$package/python" > /dev/null
          rm python.zip
          # Let it find packages installed into it later (such as PyTorch).
          for pth in "dist/$package/python/"*._pth; do
            sed -i 's/^#import site/import site/' "$pth"
            grep -qF 'Lib\site-packages' "$pth" || printf 'Lib\\site-packages\n' >> "$pth"
          done
          test -f "dist/$package/python/python.exe"
          cd dist
          7z a "$package.zip" "$package" > /dev/null
          rm -rf "$package"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish the release
    # Runs only if the build succeeded.
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: MacroMagi ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ github.event.inputs.prerelease == 'true' }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/*.zip
            dist/SHA256SUMS.txt
